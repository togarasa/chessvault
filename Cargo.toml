[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/togarasa/chessvault"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
