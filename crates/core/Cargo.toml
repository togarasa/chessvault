[package]
name = "chessvault-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for ChessVault: PGN and ChessBase database import, storage and engine access"

[dependencies]
cbvault = "0.1.6"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
shakmaty = "0.30.0"

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros"] }

# A stand-in UCI engine for tests/engine.rs; not part of ChessVault itself.
[[bin]]
name = "fake-uci-engine"
path = "tests/support/fake_engine.rs"
test = false
doc = false
